  :root{

.light {

.light html,

<script>
  async function autoSendImage(){
  const input = document.getElementById('imgInput');
  const file = input.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const base64data = reader.result.split(',')[1];
      await eel.send_image(user.id, selectedPatientId, base64data)();
      input.value = '';
      await loadMessages();
    } catch(e){
      console.error("upload image error", e);
    }
  };
  reader.readAsDataURL(file);
}

window.onload = async function(){
  try { user = JSON.parse(sessionStorage.getItem("user")); } catch(e){ user=null }
  if(!user || user.role !== "doctor"){ return location.href = "index.html"; }

  const dn = document.getElementById('docName');
if(dn) dn.innerText = user.fullname || 'Dr —';

const dr = document.getElementById('docRole');
if(dr) dr.innerText = user.role || 'Doctor';

const di = document.getElementById('docInitial');
if(di) di.innerText = (user.fullname || 'D').charAt(0).toUpperCase();

  try {
    patients = await eel.get_patients_for_doctor(user.id)();

  } catch(err){
    console.error("Failed to fetch dashboard:", err);
    patients = [];
  }

  (patients || []).forEach(p => { unreadMap[p.id] = p.unread || 0; lastMessageIds[p.id] = p.last_message_id || 0; });

  renderPatientList();
  applyThemeFromStorage();
  applyLang(); 

  startPollingForMessages();
};

document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('langBtn').addEventListener('click', toggleLang); 
document.getElementById('notifyPermissionBtn').addEventListener('click', requestNotificationPermission);


function applyThemeFromStorage(){
  const t = localStorage.getItem('theme') || 'dark';
  if(t === 'light'){
    document.documentElement.classList.add('light');
    document.getElementById('themeText').innerText = TRANSLATIONS[currentLang].themeLight;
    document.getElementById('themeBtn').querySelector('i').className = 'fa fa-sun';
  } else {
    document.documentElement.classList.remove('light');
    document.getElementById('themeText').innerText = TRANSLATIONS[currentLang].themeDark;
    document.getElementById('themeBtn').querySelector('i').className = 'fa fa-moon';
  }
}

function toggleTheme(){
  if(document.documentElement.classList.contains('light')){
    document.documentElement.classList.remove('light');
    localStorage.setItem('theme','dark');
  } else {
    document.documentElement.classList.add('light');
    localStorage.setItem('theme','light');
  }
  applyThemeFromStorage();
}

function toggleLang(){
  currentLang = (currentLang === 'ar') ? 'en' : 'ar';
  applyLang();
}

function applyLang(){
  const t = TRANSLATIONS[currentLang];

  document.getElementById("menuTitle").innerText = t.menuTitle;
  document.getElementById("btnHome").innerText = t.btnHome;
  document.getElementById("btnDoctorInfo").innerText = t.btnDoctorInfo;
  document.getElementById("btnLogout").innerText = t.btnLogout;
  
  document.getElementById("patientsTitle").innerText = t.patientsTitle;
  document.getElementById("chatHeader").innerText = t.chatHeader;
  document.getElementById("presTitle").innerText = t.presTitle;
  document.getElementById("labelSelect").innerText = t.labelSelect;
  document.getElementById("chartTitle").innerText = t.chartTitle;

  document.getElementById("searchBox").placeholder = t.placeholderSearch;
  document.getElementById("msgInput").placeholder = t.placeholderMsg;

  document.getElementById("medName").placeholder = t.placeholderMed;
  document.getElementById("dosage").placeholder = t.placeholderDosage;
  document.getElementById("timesPerDay").placeholder = t.placeholderTimes;
  document.getElementById("durationDays").placeholder = t.placeholderDuration;
  document.getElementById("presNotes").placeholder = t.placeholderNotes;

  document.querySelector("button.btn[onclick='sendPrescription()']").innerText = t.btnSendPres;

  document.querySelector("button.icon-btn[onclick='clearPrescription()']").querySelector("span").innerText = t.btnClear;

  document.querySelector("button.btn[onclick='showChart()']").innerText = t.btnShow;

  document.querySelector("button.icon-btn[onclick='downloadChart()']").innerText = t.btnDownload;

  document.querySelector("button.btn[onclick='sendMessage()']").innerText = t.btnSend;

  const chartSel = document.getElementById("chartMetric");
  chartSel.options[0].text = t.selectMetric;
  chartSel.options[1].text = t.chartMetric_glucose;
  chartSel.options[2].text = t.chartMetric_pressure;
  chartSel.options[3].text = t.chartMetric_heart;

  document.getElementById("langText").innerText = t.langBtn;

  document.getElementById("themeText").innerText =
      document.documentElement.classList.contains("light") ? t.themeLight : t.themeDark;
      
  const lblName = document.getElementById("lblName");
  if(lblName) lblName.innerText = t.lblName;

  const lblPhone = document.getElementById("lblPhone");
  if(lblPhone) lblPhone.innerText = t.lblPhone;

  const lblAddress = document.getElementById("lblAddress");
  if(lblAddress) lblAddress.innerText = t.lblAddress;


  const docInfoLabels = document.querySelectorAll('#doctorInfoPanel .detail-row > div:first-child');
  if(docInfoLabels.length >= 2){
      docInfoLabels[0].innerText = t.lblPatientsCount;
      docInfoLabels[1].innerText = t.lblPhone;
      docInfoLabels[2].innerText = (currentLang === 'ar' ? 'البريد:' : 'Email:'); 
      docInfoLabels[3].innerText = t.lblAddress;
      docInfoLabels[4].innerText = t.lblDepartment;
  }
  
  if(currentLang === "ar"){
    document.documentElement.dir = "rtl";
    document.documentElement.lang = "ar";
  } else {
    document.documentElement.dir = "ltr";
    document.documentElement.lang = "en";
  }

  populatePatientSelect(); 
  updateNotifyBtnText();  
}

function renderPatientList(){
  const ul = document.getElementById('patientsUl');
  const q = document.getElementById('searchBox').value.toLowerCase();
  ul.innerHTML = '';

  (patients || []).filter(p => (p.fullname||'').toLowerCase().includes(q)).forEach(p => {
    const li = document.createElement('li');
    li.className = 'patient';
    li.dataset.pid = p.id;

    const unreadCount = unreadMap[p.id] || 0;
    const badgeHtml = unreadCount ? `<div class="unread-badge">${unreadCount}</div>` : '';

    const avatarPulseClass = (unreadCount > 0) ? 'avatar pulse' : 'avatar';

    li.innerHTML = `
      <div class="${avatarPulseClass}">${(p.fullname||'?').slice(0,1).toUpperCase()}</div>
      <div style="flex:1">
        <div class="pname">${p.fullname}</div>
        <div class="psub">${p.phone || ''}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="icon-btn" title="Open" onclick="openChatWithId(${p.id}); event.stopPropagation();"><i class="fa fa-comment"></i></button>
        <button class="icon-btn" title="Details" onclick="openDetailPanelFor(${p.id}); event.stopPropagation();"><i class="fa fa-id-card"></i></button>
      </div>
      ${badgeHtml}
    `;
    li.addEventListener('click', () => openChatWithId(p.id));
    ul.appendChild(li);
  });
}

function populatePatientSelect(){
  const sel = document.getElementById('presPatientSelect');

  sel.innerHTML = `
    <option value="">
      ${currentLang === 'ar' ? 'اختر...' : 'Choose...'}
    </option>
  `;

  (patients || []).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.fullname;
    sel.appendChild(opt);
  });
}

async function openChatWithId(id){
  const p = patients.find(x => x.id == id);
  if(!p) return;
  selectedPatientId = p.id;
  document.getElementById('presPatientSelect').value = p.id;
  document.getElementById('chatHeader').innerText = (currentLang === 'ar' ? 'محادثة مع: ' : 'Chat with: ') + p.fullname;

  unreadMap[p.id] = 0;
  renderPatientList();

  highlightActivePatient(id);

  await loadMessages();
}

function highlightActivePatient(id){
  document.querySelectorAll('li.patient').forEach(li=>{
    if(li.dataset.pid == id) li.classList.add('active-chat'); else li.classList.remove('active-chat');
  });
}

async function loadMessages(){
  if(!selectedPatientId) {
    document.getElementById('chatBox').innerHTML = `<div class="muted">${currentLang === 'ar' ? 'اختر مريض لعرض المحادثة' : 'Select a patient to view chat'}</div>`;
    return;
  }
  try {
    const msgs = await eel.get_messages_between(user.id, selectedPatientId)();
    const box = document.getElementById('chatBox');

    box.innerHTML = msgs.map(m => {
      const isImage = m.is_image == 1;
      const content = isImage ? `<img class="chat-img" src="data:image/png;base64,${m.content}" style="max-width:260px;border-radius:8px;display:block">` : escapeHtml(m.content);
      const cls = (m.sender_id == user.id) ? 'bubble bubble-right' : 'bubble bubble-left';
      return `<div class="${cls}">${content}<div style="font-size:11px;color:var(--muted);margin-top:6px">${new Date(m.created_at).toLocaleString()}</div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;

    if(msgs && msgs.length){
      lastMessageIds[selectedPatientId] = msgs[msgs.length - 1].id || lastMessageIds[selectedPatientId];
    }
  } catch(err){
    console.error("loadMessages error:", err);
  }
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const t = input.value.trim();
  if(!t) return;
  if(!selectedPatientId) return alert(TRANSLATIONS[currentLang].alertNoPatient);
  try {
    await eel.send_message(user.id, selectedPatientId, t, 0)();
    input.value = '';
    await loadMessages();
  } catch(err){
    console.error("sendMessage error:", err);
  }
}

let pollHandle = null;
function startPollingForMessages(){
  checkForNewMessages();

  pollHandle = setInterval(checkForNewMessages, pollIntervalMs);
}

async function checkForNewMessages(){
  try {
    const summary = await eel.get_unread_summary()();
    if(summary && Array.isArray(summary)){
      summary.forEach(s => {
        const pid = s.patient_id;
        const newCount = s.unread_count || 0;
        const lastId = s.last_message_id || 0;
        const lastContent = s.last_message_content || '';
        const lastIsImage = s.last_message_is_image || 0;

        const prev = unreadMap[pid] || 0;
        unreadMap[pid] = newCount;

        if(lastId && lastId !== lastMessageIds[pid]){
          if(notificationsEnabled){
            showDesktopNotificationForPatient(pid, lastContent, lastIsImage);
          }
          lastMessageIds[pid] = lastId;
        }
      });
      renderPatientList();
    } else {
      await fallbackCheckPerPatient();
    }
  } catch(err){
    await fallbackCheckPerPatient();
  }
}

async function fallbackCheckPerPatient(){
  try {
    for(const p of patients || []){
      try {
        const last = await eel.get_last_message_info(p.id)(); 
        if(last){
          const lastId = last.last_message_id || 0;
          const prevId = lastMessageIds[p.id] || 0;
          if(lastId && lastId !== prevId){
            unreadMap[p.id] = (unreadMap[p.id] || 0) + 1;
            lastMessageIds[p.id] = lastId;
            if(notificationsEnabled){
              showDesktopNotificationForPatient(p.id, last.last_message_content || '', last.last_message_is_image || 0);
            }
            renderPatientList();
          }
        }
      } catch(_) {  }
    }
  } catch(err){
    console.error("fallbackCheckPerPatient error:", err);
  }
}

function showDesktopNotificationForPatient(patientId, content, isImage){
  const p = patients.find(x => x.id == patientId);
  const title = p ? (currentLang==='ar' ? `رسالة من ${p.fullname}` : `Message from ${p.fullname}`) : (currentLang==='ar' ? 'رسالة جديدة' : 'New message');
  let body = '';
  if(isImage) body = currentLang==='ar' ? '📷 صورة' : '📷 Image';
  else body = (typeof content === 'string' && content.length>120) ? content.slice(0,120)+'...' : content;

  try {
    const n = new Notification(title, {
      body,
      icon: '/assets/notification-icon.png' 
    });
    n.onclick = function(ev){
      window.focus();
      openChatWithId(patientId);
      n.close();
    };
  } catch (e){
    console.warn("Notification failed:", e);
  }
}

async function requestNotificationPermission(){
  if(!("Notification" in window)){
    alert(currentLang==='ar' ? "المتصفح لا يدعم الإشعارات" : "This browser does not support notifications");
    return;
  }
  try {
    let p = await Notification.requestPermission();
    notificationsEnabled = (p === 'granted');
    updateNotifyBtnText();
    if(notificationsEnabled) alert(currentLang==='ar' ? "تم تفعيل الإشعارات" : "Notifications enabled");
  } catch(e){
    console.error("requestNotificationPermission", e);
  }
}

function updateNotifyBtnText(){
  const t = TRANSLATIONS[currentLang];
  const txt = notificationsEnabled ? t.notifyOn : t.notifyOff;
  document.getElementById('notifyText').innerText = txt;
}

function openDetailPanelFor(id){
  const p = patients.find(x => x.id == id);
  if(!p) return;
  selectedPatientId = id;
  
  applyLang(); 
  populateDetailPanel(p);
  
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('detailPanel').setAttribute('aria-hidden','false');
}
function openDetailPanelForCurrent(){
  if(!selectedPatientId) return alert(TRANSLATIONS[currentLang].alertNoPatient);
  openDetailPanelFor(selectedPatientId);
}
function closeDetailPanel(){
  document.getElementById('detailPanel').classList.remove('open');
  document.getElementById('detailPanel').setAttribute('aria-hidden','true');
}
function populateDetailPanel(p){
  document.getElementById('detailName').innerText = p.fullname || '—';
  document.getElementById('d_name').innerText = p.fullname || '—';
  document.getElementById('d_phone').innerText = p.phone || '—';
  document.getElementById('d_dob').innerText = p.dob || '—';
  document.getElementById('d_address').innerText = p.address || '—';
  document.getElementById('d_notes').innerText = p.notes || '—';

  (async ()=>{
    try {
      const vitals = await eel.get_patient_vitals_summary(p.id)();
      const vitalsDiv = document.getElementById('detailVitals');
      vitalsDiv.innerHTML = '';
      if(vitals){
        Object.keys(vitals).forEach(k=>{
          const val = vitals[k] !== undefined ? vitals[k] : '—';
          const row = document.createElement('div');
          row.style.display='flex'; row.style.justifyContent='space-between'; row.style.padding='6px 0';
          row.innerHTML = `<div style="color:var(--muted)">${k}</div><div style="font-weight:700">${val}</div>`;
          vitalsDiv.appendChild(row);
        });
      }
    } catch(e){ console.warn("vitals fetch failed", e); }
  })();
}

function onPatientSelectChange(){
  selectedPatientId = parseInt(document.getElementById('presPatientSelect').value || 0);
}

async function sendPrescription(){
  if(!selectedPatientId) return alert(TRANSLATIONS[currentLang].alertNoPatient);
  const medName = document.getElementById('medName').value.trim();
  const dosage = document.getElementById('dosage').value.trim();
  const timesPerDay = document.getElementById('timesPerDay').value.trim();
  const durationDays = document.getElementById('durationDays').value.trim();
  const presNotes = document.getElementById('presNotes').value.trim();

  try {
    const r = await eel.send_prescription(user.id, selectedPatientId, medName, dosage, timesPerDay, durationDays, presNotes)();
    if(r && r.ok){
      alert(TRANSLATIONS[currentLang].okPrescription);
      clearPrescription();
    } else {
      alert(TRANSLATIONS[currentLang].errPrescription + (r && r.error ? r.error : 'unknown'));
    }
  } catch(err){
    console.error("sendPrescription error:", err);
  }
}

function clearPrescription(){
  document.getElementById('medName').value = '';
  document.getElementById('dosage').value = '';
  document.getElementById('timesPerDay').value = '';
  document.getElementById('durationDays').value = '';
  document.getElementById('presNotes').value = '';
}

async function showChart(){
  if(!selectedPatientId) return alert(TRANSLATIONS[currentLang].alertNoPatient);
  const metric = document.getElementById('chartMetric').value;
  if(!metric) return alert(TRANSLATIONS[currentLang].alertNoMetric);

  try {
    let labels = [];
    let datasets = [];

    if(metric === 'blood_pressure'){
      let sys = await eel.get_vitals(selectedPatientId,"blood_pressure_sys")();
      let dia = await eel.get_vitals(selectedPatientId,"blood_pressure_dia")();

      if((!sys || !sys.length) && (!dia || !dia.length)) return alert(TRANSLATIONS[currentLang].alertNoData);

      labels = sys.length ? sys.map(v => new Date(v.created_at).toLocaleString()) : dia.map(v=> new Date(v.created_at).toLocaleString());

      datasets = [
        { label: currentLang === 'ar' ? 'SYS ' : 'SYS (systolic)', data: sys.map(v=>v.value), borderColor: getColor(0), tension:0.2, fill:false },
        { label: currentLang === 'ar' ? 'DIA ' : 'DIA (diastolic)', data: dia.map(v=>v.value), borderColor: getColor(1), tension:0.2, fill:false }
      ];
    } else {
      let data = await eel.get_vitals(selectedPatientId, metric)();
      if(!data || !data.length) return alert(TRANSLATIONS[currentLang].alertNoData);
      labels = data.map(v => new Date(v.created_at).toLocaleString());
      datasets = [{ label: metric, data: data.map(v=>v.value), borderColor: getColor(2), tension:0.2, fill:false }];
    }

    if(chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('doctorChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        plugins: { legend:{ labels:{ color: getTextColor() } }},
        scales: {
          x:{ ticks:{ color: getTextColor() }, grid:{ color: 'rgba(255,255,255,0.03)' } },
          y:{ ticks:{ color: getTextColor() }, grid:{ color: 'rgba(255,255,255,0.03)' } }
        }
      }
    });

  } catch(err){
    console.error("showChart error:", err);
  }
}

function getColor(i){
  const arr = ['#7c3aed','#00d4ff','#27d07d','#ffb86b'];
  return arr[i % arr.length];
}
function getTextColor(){
  return document.documentElement.classList.contains('light') ? '#071018' : '#e6eef6';
}

function downloadChart(){
  if(!chartInstance) return;
  const url = document.getElementById('doctorChart').toDataURL('image/png', 1.0);
  const a = document.createElement('a');
  a.href = url; a.download = `chart_${Date.now()}.png`; a.click();
}

function escapeHtml(text){
  if(!text) return '';
  return String(text).replace(/[&<>"'`=\/]/g, function(s){ return ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'
  })[s]});
}

function logout(){
  sessionStorage.clear();
  location.href = "index.html";
}

window.addEventListener('beforeunload', ()=> {
  if(pollHandle) clearInterval(pollHandle);
});

window._unreadMap = unreadMap;
window._lastMessageIds = lastMessageIds;

function openDetailPanelFor(id){
    const p = patients.find(x => x.id == id);
    if(!p) return;

    applyLang(); 

    document.getElementById('detailName').innerText = p.fullname || '—';
    document.getElementById('d_name').innerText = p.fullname || '—';
    document.getElementById('d_phone').innerText = p.phone || '—';
    document.getElementById('d_address').innerText = p.address || '—';

    document.getElementById('overlayBlur').style.display = "block";

}

function closeDetailPanel(){
    document.getElementById('detailPanel').classList.remove('open');
    document.getElementById('overlayBlur').style.display = "none";
}
async function showDoctorPanel() {
    const info = await eel.get_doctor_info(user.id)();

    if (!info.ok) return alert("خطأ في تحميل البيانات");

    const d = info.doctor;
    
    applyLang();

    document.getElementById("docInfoName").innerText = d.fullname;
    document.getElementById("docInfoPatients").innerText = d.total_patients;
    document.getElementById("docInfoPhone").innerText = d.phone || "—";
    document.getElementById("docInfoEmail").innerText = d.email || "—";
    document.getElementById("docInfoAddress").innerText = d.address || "—";
    document.getElementById("docInfoDept").innerText = d.dept_id || "—";
    document.getElementById("overlayBlur").style.display = "block";
    document.getElementById("doctorInfoPanel").classList.add("open");
}

function closeDoctorPanel() {
    document.getElementById("doctorInfoPanel").classList.remove("open");
    document.getElementById("overlayBlur").style.display = "none";
}

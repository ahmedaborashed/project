<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title data-i18n="administrative">الإداري</title>
<link rel="stylesheet" href="styles.css">
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0b0f14;
  --panel: #0f1720;
  --text: #e6eef6;
  --muted: #9aa6b2;
  --accent: #7c3aed;
  --border: #1f2937;
  --card: #0b1116;
}

.light {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --border: #e5e7eb;
  --card: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  overflow: hidden;
}

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }

.bubble {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 16px;
  line-height: 1.5;
  word-wrap: break-word;
  position: relative;
  font-size: 14px;
  animation: popIn 0.2s ease;
}
.bubble-left {
  background: var(--border);
  color: var(--text);
  border-bottom-right-radius: 4px;
  align-self: flex-start;
}
.bubble-right {
  background: var(--accent);
  color: white;
  border-bottom-left-radius: 4px;
  align-self: flex-end;
}
.light .bubble-left { background: #e5e7eb; }

@keyframes popIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.badge {
  background: #ef4444;
  color: white;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  margin-right: 6px;
}

.patient-btn {
  transition: 0.2s;
  border-bottom: 1px solid var(--border) !important;
  border-radius: 0 !important;
}
.patient-btn:hover { background: var(--border); }

#searchPatient {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  margin-bottom: 10px;
  height: 42px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
#searchPatient:focus {
  border-color: var(--accent);
}

.topbar {
  position: sticky;
  top: 0;
  background: var(--panel);
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  z-index: 1000;
}

.small { padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <button class="btn small" onclick="toggleTheme()">🌓 <span id="themeText">Dark</span></button>
  <button class="btn small" onclick="toggleLang()">🌐 <span id="langText">عربي</span></button>
</div>

<div class="container" style="display:flex; gap:18px; align-items:flex-start; padding:12px; height: calc(100vh - 60px);">

  <aside style="width:300px; display:flex; flex-direction:column; gap:12px; height: 100%;">
    <div class="card">
      <h3 data-i18n="administrative" style="margin:0 0 10px 0">الإدارية</h3>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn" data-i18n="messages" onclick="showPanel('messages')">الرسائل</button>
        <button class="btn ghost" data-i18n="logout" onclick="logout()">تسجيل خروج</button>
      </div>
    </div>
    
    <div class="card" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <input id="searchPatient" 
             data-i18n-placeholder="search_patient" 
             placeholder="ابحث باسم المريض..." 
             oninput="filterPatients()">
      <ul id="msgList" style="padding:0; margin:0; list-style:none; overflow-y:auto; flex:1;"></ul>
    </div>
  </aside>

  <main style="flex:1; height: 100%;">
    <div id="panel_messages" class="panel" style="display:block; height: 100%;">
      <div class="card" style="display:flex; flex-direction:column; height:100%; padding:0; overflow:hidden">
        
        <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:var(--panel)">
          <div id="chatHeader" style="font-weight:700" data-i18n="select_patient">اختر مريضاً</div>
          <button class="btn danger small" onclick="deleteConversation()" id="btnDeleteConv" style="display:none" data-i18n="delete_conv">حذف المحادثة</button>
        </div>

        <div id="msgWindow" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; background:var(--bg)"></div>

        <div style="padding:15px; background:var(--panel); border-top:1px solid var(--border); display:flex; gap:8px;">
          <input id="msgInputAdmin" data-i18n-placeholder="type_msg" placeholder="اكتب رسالة..." style="flex:1; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text)">
          <button class="btn" onclick="sendMessageAdmin()" data-i18n="send">إرسال</button>
          <button class="btn ghost" onclick="triggerImage()">📷</button>
          <input type="file" id="imgInput" accept="image/*" style="display:none">
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/eel.js"></script>
<script src="administrative.js"></script>
</body>
</html>
